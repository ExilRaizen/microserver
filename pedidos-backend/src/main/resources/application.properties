spring.application.name=pedidos-backend
server.port=8081

spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=785588af-9f25-4dc1-a2d9-afbe56ee1787
spring.cloud.azure.active-directory.credential.client-id=0e7d4bab-2455-4de8-bb75-c49e17617089
spring.cloud.azure.active-directory.app-id-uri=api://0e7d4bab-2455-4de8-bb75-c49e17617089

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidosdb}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================
# CONFIGURACIÓN DE RABBITMQ (CLUSTER)
# ============================================
# Los dos nodos del cluster: si el primero no responde, se conecta al segundo
spring.rabbitmq.addresses=localhost:5672,localhost:5673
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/

# Reintentos al enviar mensajes
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-interval=30000
spring.rabbitmq.template.retry.multiplier=2.0

# ============================================
# CONFIGURACIÓN DE KAFKA (3 BROKERS)
# ============================================
# Los tres brokers: el cliente descubre el cluster completo desde cualquiera de ellos
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=pedidos-backend

# Productor: key en texto (el plan) y value en JSON (el DTO del evento)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Confirmación de todas las réplicas sincronizadas e idempotencia: sin pérdidas ni duplicados al reintentar
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Si Kafka no responde, el envío falla en pocos segundos en vez de dejar colgada la petición
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.linger.ms=5

# Sin headers con el nombre de la clase Java: cada consumidor deserializa a su propio DTO
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumidor de "catalogo.planes": lee el estado de los planes que publica Catálogo
# ErrorHandlingDeserializer evita que un JSON roto bote al consumidor
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=micro.pedidos.pedidos_backend.messaging.kafka.PlanActualizadoEvento
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=micro.pedidos.pedidos_backend.messaging.kafka
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
