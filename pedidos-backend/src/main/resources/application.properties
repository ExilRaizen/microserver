spring.application.name=pedidos-backend
server.port=8081

spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=785588af-9f25-4dc1-a2d9-afbe56ee1787
spring.cloud.azure.active-directory.credential.client-id=0e7d4bab-2455-4de8-bb75-c49e17617089
spring.cloud.azure.active-directory.app-id-uri=api://0e7d4bab-2455-4de8-bb75-c49e17617089

spring.datasource.url=jdbc:postgresql://pedidos-db.chxgchynhyuf.us-east-1.rds.amazonaws.com:5432/pedidosdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# Configuración de RabbitMQ
# host: localhost - RabbitMQ está en tu máquina local
spring.rabbitmq.host=localhost
# port: 5672 - Puerto AMQP estándar
spring.rabbitmq.port=5672
# username/password - Credenciales por defecto
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# virtual-host: / - Virtual host por defecto
spring.rabbitmq.virtual-host=/

# Reintentos al enviar mensajes
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-interval=30000
spring.rabbitmq.template.retry.multiplier=2.0