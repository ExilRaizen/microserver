spring.application.name=soporte-backend
server.port=8083

spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=785588af-9f25-4dc1-a2d9-afbe56ee1787
spring.cloud.azure.active-directory.credential.client-id=0e7d4bab-2455-4de8-bb75-c49e17617089
spring.cloud.azure.active-directory.app-id-uri=api://0e7d4bab-2455-4de8-bb75-c49e17617089

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidosdb}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================
# CONFIGURACIÓN DE RABBITMQ (CLUSTER)
# ============================================
# Los dos nodos del cluster: si el primero no responde, se conecta al segundo
spring.rabbitmq.addresses=localhost:5672,localhost:5673
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
logging.level.micro.soporte=INFO