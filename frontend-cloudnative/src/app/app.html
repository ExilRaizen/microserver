<div class="app-shell">
  <header class="app-header">
    <h1>Microservers</h1>
    <p class="subtitle">Panel de administración de hosting</p>

    <div class="actions">
      @if (!isLoggedIn()) {
        <button class="btn btn-primary" (click)="login()">Iniciar sesión</button>
      }
      @if (isLoggedIn()) {
        <button class="btn btn-secondary" (click)="logout()">Cerrar sesión</button>
        <button class="btn btn-primary" (click)="probarPedido()">Probar Pedidos</button>
        <button class="btn btn-primary" (click)="probarCatalogo()">Ver Catálogo</button>
        <button class="btn btn-primary" (click)="probarSoporte()">Crear Ticket</button>
      }
    </div>

    @if (testResult()) {
      <p class="result">{{ testResult() }}</p>
    }
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
