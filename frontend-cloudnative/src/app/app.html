<div class="app-shell">
  <header class="app-header">
    <h1>Microservers</h1>
    <p class="subtitle">Panel de administración de hosting</p>

    <div class="actions">
      @if (!isLoggedIn()) {
        <button class="btn btn-primary" (click)="login()">Iniciar sesión</button>
      }
      @if (isLoggedIn()) {
        <button class="btn btn-secondary" (click)="logout()">Cerrar sesión</button>
        <button class="btn btn-primary" (click)="probarPedido()">Probar Pedidos</button>
        <button class="btn btn-primary" (click)="probarCatalogo()">Ver Catálogo</button>
        <button class="btn btn-primary" (click)="probarSoporte()">Crear Ticket</button>
      }
    </div>

    @if (isLoggedIn()) {
      <div class="actions">
        <span class="actions-label">Kafka</span>
        <button class="btn btn-secondary" (click)="verAnaliticaPlanes()">Analítica por plan</button>
        <button class="btn btn-secondary" (click)="verAnaliticaClientes()">Analítica por cliente</button>
        <button class="btn btn-secondary" (click)="verCatalogoLocal()">Catálogo local</button>
        <button class="btn btn-secondary" (click)="verTopicsKafka()">Tópicos</button>
        <button class="btn btn-secondary" (click)="verGruposKafka()">Grupos</button>
      </div>
    }

    @if (testResult()) {
      <p class="result">{{ testResult() }}</p>
    }
    @if (detalle()) {
      <pre class="detalle">{{ detalle() }}</pre>
    }
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
